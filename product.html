<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Товар — MOTOMIX</title>
    <meta name="description" content="Характеристики, опис, комплектація та відгуки. Замовлення мототехніки MOTOMIX, Біла Церква.">
    <link rel="preload" href="/components/header" as="fetch">
    <link rel="preload" href="/components/footer" as="fetch">
    <link rel="preload" as="image" href="/assets/logo.png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/styles.css">
    <script>document.documentElement.classList.add('booting');</script>
    <link rel="icon" href="/assets/favicon.png" sizes="64x64">
    <meta name="theme-color" content="#F2F1ED">
    <script src="/data.js" defer></script>
    <script src="/app.js" defer></script>
</head>

<body class="inner">
    <div data-include="/components/header"></div>

    <section class="section section--pdp">
        <div class="wrap">
            <div class="pdp" id="pdp"></div>
        </div>
    </section>

    <section class="section section--tint" style="padding-block:clamp(44px,5vw,80px)">
        <div class="wrap">
            <div class="shead">
                <div class="shead__l">
                    <span class="eyebrow"><span class="slashes"><i></i><i></i><i></i></span> Відгуки</span>
                    <h2 class="stitle">Що кажуть клієнти</h2>
                </div>
                <button class="btn btn--line" data-order="Відгук про товар">Залишити відгук</button>
            </div>
            <div class="revs-view"><div class="revs" id="reviews"></div></div>
            <div class="revs-ctl">
                <div class="rail__bar" id="rev-bar"><i></i></div>
                <div class="revs-nav">
                    <button class="rail__nav" id="rev-prev" type="button" aria-label="Попередні відгуки"><svg class="icon"><use href="#ic-arrow-l"></use></svg></button>
                    <button class="rail__nav" id="rev-next" type="button" aria-label="Наступні відгуки"><svg class="icon"><use href="#ic-arrow"></use></svg></button>
                </div>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="wrap">
            <div class="shead">
                <div class="shead__l">
                    <span class="eyebrow"><span class="slashes"><i></i><i></i><i></i></span> Схоже</span>
                    <h2 class="stitle">Схожі моделі</h2>
                </div>
                <a href="/catalog" class="tlink">Весь каталог <svg class="icon"><use href="#ic-arrow"></use></svg></a>
            </div>
            <div class="pgrid" id="related"></div>
        </div>
    </section>

    <div data-include="/components/footer"></div>
</body>

</html>
