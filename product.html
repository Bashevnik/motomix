<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Товар — MOTOMIX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/logo.png">

<body class="inner">
    <div data-include="components/header.html"></div>

    <section class="section section--pdp">
        <div class="wrap">
            <div class="pdp" id="pdp"></div>
        </div>
    </section>

    <section class="section section--tint" style="padding-block:clamp(44px,5vw,80px)">
        <div class="wrap">
            <div class="shead">
                <div class="shead__l">
                    <span class="eyebrow"><span class="slashes"><i></i><i></i><i></i></span> Відгуки</span>

    <section class="section">
        <div class="wrap">
            <div class="shead">
                <div class="shead__l">
                    <span class="eyebrow"><span class="slashes"><i></i><i></i><i></i></span> Схоже</span>
                    <h2 class="stitle">Схожі моделі</h2>
                </div>
                <a href="catalog.html" class="tlink">Весь каталог <svg class="icon"><use href="#ic-arrow"></use></svg></a>
            </div>
            <div class="pgrid" id="related"></div>

    <div data-include="components/footer.html"></div>
    <script src="data.js"></script>
    <script src="app.js"></script>
