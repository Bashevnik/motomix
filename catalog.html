<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Каталог мототехніки — MOTOMIX</title>
    <meta name="description" content="Каталог MOTOMIX: ендуро, пітбайки, мотоцикли, скутери, екіпіровка. Бренди GEON, KOVI, KAYO, SHINERAY. Біла Церква, доставка по Україні.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/logo.png">
    <meta name="theme-color" content="#F2F1ED">
</head>

<body class="inner">
    <div data-include="components/header.html"></div>

    <section class="phero phero--compact">
        <div class="phero__media"><img src="assets/hero/story-2.jpg" alt="" id="cat-img"></div>
        <div class="wrap phero__in">
            <div class="crumbs"><a href="index.html">Головна</a><em>›</em><a href="catalog.html" id="cat-crumb-link">Каталог</a><span id="cat-crumb-tail"></span></div>
            <h1 id="cat-h1">Каталог мототехніки</h1>
            <p id="cat-desc"></p>
        </div>
    </section>

    <section class="section" style="padding-top:clamp(24px,2.6vw,40px)">
        <div class="wrap">
            <div class="fbar" id="fbar">
                <span class="fbar__t">Фільтр</span>
                <div class="fdd" data-g="cat"><button class="fdd__b" type="button">Тип <svg class="icon"><use href="#ic-chev"></use></svg></button><div class="fdd__p"></div></div>
                <div class="fdd" data-g="brand"><button class="fdd__b" type="button">Бренд <svg class="icon"><use href="#ic-chev"></use></svg></button><div class="fdd__p"></div></div>
                <div class="fdd" data-g="cc"><button class="fdd__b" type="button">Об’єм, см³ <svg class="icon"><use href="#ic-chev"></use></svg></button><div class="fdd__p"></div></div>
                <button class="fdd__reset" id="f-reset" type="button">Скинути</button>
                <div class="fbar__sort">
                    <span>Сортування:</span>
                    <select class="fsort" id="f-sort" aria-label="Сортування">
                        <option value="default">за замовчуванням</option>
                        <option value="az">назва A→Я</option>
                        <option value="za">назва Я→A</option>
                    </select>
                </div>
            </div>
            <div class="fchips" id="f-chips"></div>
            <div class="fcount" id="f-count"></div>
            <div class="pgrid" id="catalog-grid"></div>
        </div>
    </section>

    <section class="cta">
        <img class="cta__bg" src="assets/hero/forest-ride.jpg" alt="">
        <div class="cta__shade"></div>
        <div class="wrap cta__in">
            <div class="cta__l">
                <span class="eyebrow"><span class="slashes"><i></i><i></i><i></i></span> Підбір</span>
                <h2 class="cta__title">Не знайшов<br>потрібну модель?</h2>
                <p>Напиши нам — підберемо під бюджет і привеземо під замовлення.</p>
            </div>
            <button class="btn btn--red btn--lg" data-order="Підбір з каталогу">Залишити заявку</button>
        </div>
    </section>

    <div data-include="components/footer.html"></div>
    <script src="app.js"></script>
</body>

</html>
