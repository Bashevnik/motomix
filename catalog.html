<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Каталог мототехніки — MOTOMIX</title>
    <meta name="description" content="Каталог MOTOMIX: 45 позицій — мотоцикли, квадроцикли, електроскутери, аксесуари. KOVI, LIFAN, GEON, KAYO, SHINERAY. Біла Церква.">
    <link rel="preload" href="/components/header" as="fetch">
    <link rel="preload" href="/components/footer" as="fetch">
    <link rel="preload" as="image" href="/assets/logo.png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/styles.css">
    <script>document.documentElement.classList.add('booting');</script>
    <link rel="icon" href="/assets/favicon.png" sizes="64x64">
    <meta name="theme-color" content="#F2F1ED">
    <script src="/data.js" defer></script>
    <script src="/app.js" defer></script>
</head>

<body class="inner">
    <div data-include="/components/header"></div>

    <section class="phero phero--compact">
        <div class="phero__media"><img alt="" id="cat-img" fetchpriority="high" decoding="async"></div>
        <script>
        /* Банер ставимо ДО першої відмальовки: інакше встигає з'явитися дефолтне
           фото, а потім підмінитися на потрібне — те саме «мерехтіння». */
        (function () {
          var MAP = {
                    "Ендуро": "/assets/olx/kovi-adt-300-r-2026-novyy-1.jpg",
                    "Мотарди": "/assets/olx/kovi-300-pro-motard-2026-novyy-1.jpg",
                    "Дорожні": "/assets/olx/kavasaki-vulkan-900-2013-kavasaki-vulkan-1.jpg",
                    "Спортбайки": "/assets/olx/lifan-kpr-250-2026-28-ls-inzhektor-1.jpg",
                    "Пітбайки": "/assets/olx/v-nayavnosti-novyy-kovi-pit-150-2026-1.jpg",
                    "Квадроцикли": "/assets/olx/quadraterra-300-4x4-2026-novyy-1.jpg",
                    "Електроскутери": "/assets/olx/fada-stilo-1500w-nova-1.jpg",
                    "Аксесуари": "/assets/olx/protyvotumanky-dlya-moto-12-v-try-riznykh-kolor-1.jpg",
                    "Мотоцикли": "/assets/olx/kovi-adt-300-r-2026-novyy-1.jpg"
          };
          var DEF = '/assets/hero/moto-dark.jpg';
          var q = new URLSearchParams(location.search);
          var key = q.get('type') || q.get('cat');
          var img = document.getElementById('cat-img');
          var src = (key && MAP[key]) || DEF;
          if (img) img.src = src;
        })();
        </script>
        <div class="wrap phero__in">
            <div class="crumbs"><a href="/">Головна</a><em>›</em><a href="/catalog" id="cat-crumb-link">Каталог</a><span id="cat-crumb-tail"></span></div>
            <h1 id="cat-h1">Каталог мототехніки</h1>
            <p id="cat-desc"></p>
        </div>
    </section>

    <section class="section" style="padding-top:clamp(24px,2.6vw,40px)">
        <div class="wrap">
            <div class="fbar" id="fbar">
                <span class="fbar__t">Фільтр</span>
                <div class="fdd" data-g="type"><button class="fdd__b" type="button">Тип <svg class="icon"><use href="#ic-chev"></use></svg></button><div class="fdd__p" data-lenis-prevent></div></div>
                <div class="fdd" data-g="brand"><button class="fdd__b" type="button">Бренд <svg class="icon"><use href="#ic-chev"></use></svg></button><div class="fdd__p" data-lenis-prevent></div></div>
                <div class="fdd" data-g="cc"><button class="fdd__b" type="button">Об’єм, см³ <svg class="icon"><use href="#ic-chev"></use></svg></button><div class="fdd__p" data-lenis-prevent></div></div>
                <div class="fdd" data-g="price"><button class="fdd__b" type="button">Ціна, ₴ <svg class="icon"><use href="#ic-chev"></use></svg></button><div class="fdd__p" data-lenis-prevent></div></div>
                <button class="fdd__reset" id="f-reset" type="button">Скинути</button>
                <div class="fbar__sort">
                    <span>Сортування:</span>
                    <select class="fsort" id="f-sort" aria-label="Сортування">
                        <option value="default">за замовчуванням</option>
                        <option value="az">назва A→Я</option>
                        <option value="za">назва Я→A</option>
                        <option value="cheap">спочатку дешевші</option>
                        <option value="exp">спочатку дорожчі</option>
                    </select>
                </div>
            </div>
            <div class="fchips" id="f-chips"></div>
            <div class="fcount" id="f-count"></div>
            <div class="pgrid" id="catalog-grid"></div>
        </div>
    </section>

    <section class="cta">
        <img class="cta__bg" src="/assets/olx/kovi-300-pro-motard-2026-novyy-3.jpg" alt="" loading="lazy" decoding="async">
        <div class="cta__shade"></div>
        <div class="wrap cta__in">
            <div class="cta__l">
                <span class="eyebrow"><span class="slashes"><i></i><i></i><i></i></span> Підбір</span>
                <h2 class="cta__title">Не знайшов<br>потрібну модель?</h2>
                <p>Напиши нам — підберемо під бюджет і привеземо під замовлення.</p>
            </div>
            <button class="btn btn--red btn--lg" data-order="Підбір з каталогу">Залишити заявку</button>
        </div>
    </section>

    <div data-include="/components/footer"></div>
</body>

</html>
