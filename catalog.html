<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Каталог мототехніки — MOTOMIX</title>
    <meta name="description" content="Каталог MOTOMIX: ендуро, пітбайки, мотоцикли, скутери, екіпіровка. Бренди GEON, KOVI, KAYO, SHINERAY. Біла Церква, доставка по Україні.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/logo.png">
    <meta name="theme-color" content="#F2F1ED">
</head>

<body>
    <div data-include="components/header.html"></div>

    <section class="phero phero--compact">
        <div class="phero__media"><img src="assets/hero/story-2.jpg" alt=""></div>
        <div class="wrap phero__in">
            <div class="crumbs"><a href="index.html">Головна</a><em>/</em><span>Каталог</span></div>
            <h1>Каталог мототехніки</h1>
        </div>
    </section>

    <section class="section" style="padding-top:clamp(28px,3vw,48px)">
        <div class="wrap shop">
            <aside class="fside" id="fside">
                <div class="fgroup">
                    <div class="fgroup__t">Напрям</div>
                    <div class="flist" id="f-cats"></div>
                </div>
                <div class="fgroup">
                    <div class="fgroup__t">Бренд</div>
                    <div class="flist" id="f-brands"></div>
                </div>
                <button class="btn btn--line btn--block" id="f-reset">Скинути фільтри</button>
            </aside>
            <div>
                <div class="fbar-top">
                    <span class="fcount" id="f-count"></span>
                    <button class="btn btn--line fmobile" id="f-toggle">Фільтри</button>
                    <select class="fsort" id="f-sort" aria-label="Сортування">
                        <option value="default">За замовчуванням</option>
                        <option value="az">Назва A→Я</option>
                        <option value="za">Назва Я→A</option>
                    </select>
                </div>
                <div class="pgrid" id="catalog-grid"></div>
            </div>
        </div>
    </section>

    <section class="cta">
        <img class="cta__bg" src="assets/hero/forest-ride.jpg" alt="">
        <div class="cta__shade"></div>
        <div class="wrap cta__in">
            <div class="cta__l">
                <span class="eyebrow"><span class="slashes"><i></i><i></i><i></i></span> Підбір</span>
                <h2 class="cta__title">Не знайшов<br>потрібну модель?</h2>
                <p>Напиши нам — підберемо під бюджет і привеземо під замовлення.</p>
            </div>
            <button class="btn btn--red btn--lg" data-order="Підбір з каталогу">Залишити заявку</button>
        </div>
    </section>

    <div data-include="components/footer.html"></div>
    <script src="app.js"></script>
</body>

</html>
